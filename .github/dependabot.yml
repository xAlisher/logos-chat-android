# Dependency updates. Grouped and rate-limited deliberately: this is a solo-maintained repo and
# an unbounded PR firehose is worse than no automation at all.
#
# Every ecosystem sets a `cooldown`. A newly published version is the highest-risk version there
# is — compromised-maintainer and typosquat attacks are usually caught within days of publish, so
# waiting before auto-proposing an upgrade turns "we adopted it in an hour" into "we adopted it
# after the ecosystem had a week to notice." For a messenger whose users assume their traffic is
# private, that trade is clearly worth one week of latency on non-security bumps.
#
# Note: cooldown delays *version* updates. Dependabot **security** alerts and security PRs are not
# subject to it, so a known-CVE fix still arrives immediately.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # One PR for routine patch/minor bumps; majors still come through individually so they
      # get read properly.
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # #470: the Babel major line is not ours to pick. Every transform this repo actually runs
      # comes from `module:@react-native/babel-preset` (babel.config.js and jest.logic.config.js),
      # and React Native 0.86 ships that preset with `@babel/core@^7.25.2` as a hard dependency
      # and a Babel-7 plugin tree underneath it. The root `@babel/core` devDep exists only to
      # satisfy that preset's `peer @babel/core: *` — nothing in this repo loads it directly.
      #
      # So bumping it to 8 buys nothing and costs a lot: #470 made `npm ci` fail outright
      # (ERESOLVE, `@babel/preset-env@7` peers on `@babel/core@^7.0.0-0`), and bumping
      # preset-env to 8 alongside it only downgrades that to 15 silently-overridden peers —
      # jest's Babel-7 syntax plugins handed a Babel-8 core — while inflating the install from
      # 911 to 1274 packages and from 1 to 16 copies of `@babel/core`. Tripling the build-time
      # supply-chain surface of a messenger for an unused devDep is the wrong trade.
      #
      # Lift this when React Native itself moves to Babel 8; `__tests__/babelToolchain.test.ts`
      # holds the same line from inside the repo.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]

      # #505: same story, different toolchain. The ESLint major is set by
      # `@react-native/eslint-config`, which is the entire content of this repo's lint config
      # (.eslintrc.js is `extends: '@react-native'` and nothing else).
      #
      # #505 bumped eslint to 10.8.0 and both required jobs died at `npm ci` with ERESOLVE:
      # `@react-native/eslint-config@0.86.2` peers on `eslint@^8.0.0 || ^9.0.0`. No published
      # release fixes that — 0.86.2 is `latest`, and even the 0.88.0 nightlies still declare the
      # same `^8 || ^9`. ESLint 10 also removed eslintrc outright, so adopting it means rewriting
      # the config for a shared config that cannot run under it.
      #
      # ESLint 9 is not the escape hatch either, despite being inside that peer range. The config
      # subtree carries `eslint-plugin-ft-flow@^8.1.0`, and under ESLint 9 loading it throws
      # `TypeError: context.getAllComments is not a function` before a single file is linted —
      # verified locally on this branch. The peer range is optimistic; 8 is the only major the
      # shared config's own dependencies actually run on.
      #
      # Lift this when React Native ships an eslint-config whose whole subtree accepts 9+;
      # `__tests__/lintToolchain.test.ts` holds the same line from inside the repo and will fail
      # loudly at that point.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels: [dependencies]

# NOTE: this does NOT cover the native messaging cores. liblogoschat.so is built from a patched
# fork of logos-messaging/libchat and its Rust dependency tree has no advisory feed reaching this
# repo — so a clean Dependabot/npm-audit run says nothing about it. That gap is real and is not
# closed by this file.
