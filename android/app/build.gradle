apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.logoschat"
    defaultConfig {
        applicationId "com.logoschat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 83
        versionName "0.7.71"
        ndk {
            // liblogoschat.so is built for arm64 only (emulators can't run the Nim node anyway)
            abiFilters "arm64-v8a"
        }
    }
    packagingOptions {
        jniLibs {
            // We vendor libc++_shared.so (liblogoschat's DT_NEEDED); RN AARs ship their own copy.
            pickFirsts += ['**/libc++_shared.so']
            // DUAL-BINARY (#51): we load the chosen variant by ABSOLUTE PATH via
            // System.load(nativeLibraryDir + "/liblogoschat_<variant>.so"). Modern
            // AGP packs .so uncompressed inside the APK (extractNativeLibs=false),
            // so nativeLibraryDir has no files on disk and System.load(path) fails
            // ("library not found"). Legacy packaging extracts them at install so the
            // absolute-path load resolves. System.loadLibrary(name) is unaffected.
            useLegacyPackaging true
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    testOptions {
        unitTests {
            // Robolectric drives the real SQLite framework classes in JVM unit
            // tests (#21 schema tests run with plain `gradle test`).
            includeAndroidResources = true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // #258 Phase 2: encrypt the app-side ChatDb at rest. SQLCipher provides a
    // SupportSQLiteOpenHelper.Factory; the AndroidX SupportSQLite abstraction lets
    // the Robolectric tests keep using the framework (plaintext) factory.
    implementation("net.zetetic:sqlcipher-android:4.6.1")
    implementation("androidx.sqlite:sqlite:2.4.0")
    implementation("androidx.sqlite:sqlite-framework:2.4.0")

    testImplementation("junit:junit:4.13.2")
    testImplementation("org.robolectric:robolectric:4.14.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

/**
 * Guard against shipping a STALE JNI bridge. liblogoschat_bridge.so is built
 * out-of-band by scripts/build-bridge.sh (NOT by gradle — RN New Arch owns the
 * CMake pipeline). So editing logoschat_jni.c + adding an `external fun` in
 * NodeBridge.kt WITHOUT re-running build-bridge.sh compiles + packages fine, then
 * crashes at runtime with UnsatisfiedLinkError (this exact bug shipped in v0.7.9,
 * #213). This task asserts every `external fun chat*` has its JNI symbol in the
 * packaged .so and fails the build with a fix hint if not. Best-effort: if llvm-nm
 * can't be located it warns instead of failing (never breaks an exotic host/CI).
 */
tasks.register("checkBridgeSymbols") {
    def bridge = file("src/main/jniLibs/arm64-v8a/liblogoschat_bridge.so")
    def kt = file("src/main/java/com/logoschat/NodeBridge.kt")
    doLast {
        if (!bridge.exists() || !kt.exists()) {
            logger.warn("checkBridgeSymbols: bridge or NodeBridge.kt missing — skipping")
            return
        }
        // Every native method the Kotlin side declares.
        def declared = (kt.text =~ /external fun (\w+)/).collect { it[1] }.unique()
        // Locate an nm that can read an ELF .so.
        def host = org.gradle.internal.os.OperatingSystem.current().isMacOsX() ? "darwin-x86_64" : "linux-x86_64"
        def nm = new File("${android.sdkDirectory}/ndk/${rootProject.ext.ndkVersion}/toolchains/llvm/prebuilt/${host}/bin/llvm-nm")
        if (!nm.exists()) {
            logger.warn("checkBridgeSymbols: llvm-nm not found at ${nm} — skipping symbol check")
            return
        }
        def proc = [nm.absolutePath, "-D", bridge.absolutePath].execute()
        def symbols = proc.inputStream.text
        proc.waitFor()
        def missing = declared.findAll { !symbols.contains("Java_com_logoschat_NodeBridge_${it}") }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "STALE JNI bridge: liblogoschat_bridge.so is missing symbols for external fun(s): ${missing}.\n" +
                "  Fix: run  bash scripts/build-bridge.sh  then rebuild the APK.\n" +
                "  (The bridge is built out-of-band; editing logoschat_jni.c is not enough.)")
        }
        logger.lifecycle("checkBridgeSymbols: OK — all ${declared.size()} external funs present in the bridge")
    }
}

// Run the guard before native libs are merged into any release APK/bundle.
tasks.configureEach { t ->
    if (t.name == "mergeReleaseNativeLibs") {
        t.dependsOn("checkBridgeSymbols")
    }
}
